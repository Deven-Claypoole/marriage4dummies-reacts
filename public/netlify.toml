[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[functions."m4d-push-dispatch"]
  schedule = "* * * * *"
